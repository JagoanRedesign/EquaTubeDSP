
name: Build EquaTube DSP APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'EquaTubeDSP-Android-Starter.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download source code
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # 5. Accept Android licenses
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          status=${PIPESTATUS[1]}
          exit "$status"

      # 6. Install Android SDK, NDK and CMake
      - name: Install Android tools
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      # 7. Extract project ZIP
      - name: Extract project
        run: |
          mkdir -p project
          unzip -q EquaTubeDSP-Android-Starter.zip -d project

      # 8. Check project structure
      - name: Check project files
        run: |
          echo "Checking project..."
          ls -la project/EquaTubeDSP
          test -f project/EquaTubeDSP/settings.gradle.kts
          test -f project/EquaTubeDSP/build.gradle.kts
          test -f project/EquaTubeDSP/app/build.gradle.kts
          test -f project/EquaTubeDSP/app/src/main/cpp/CMakeLists.txt

      # 9. Show Android environment
      - name: Check Android environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      # 10. Build APK and capture errors
      - name: Build APK
        shell: bash
        run: |
          cd project/EquaTubeDSP
          set +e
          gradle --no-daemon --stacktrace --info assembleDebug 2>&1 | tee build-log.txt
          RESULT=${PIPESTATUS[0]}
          echo "BUILD_EXIT_CODE=$RESULT"
          exit "$RESULT"

      # 11. Show APK output
      - name: Check APK output
        if: always()
        run: |
          echo "APK files:"
          find project/EquaTubeDSP/app/build/outputs -type f || true

      # 12. Upload diagnostic log
      - name: Upload build error log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EquaTubeDSP-Build-Log
          path: project/EquaTubeDSP/build-log.txt
          if-no-files-found: ignore
          retention-days: 7

      # 13. Upload APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EquaTubeDSP-APK
          path: project/EquaTubeDSP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
