name: Build EquaTube DSP APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'EquaTubeDSP-Android-Starter.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build EquaTube DSP APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # Explicit package list avoids the deprecated SDK package "tools".
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Validate source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f EquaTubeDSP-Android-Starter.zip
          unzip -t EquaTubeDSP-Android-Starter.zip

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project
          unzip -q EquaTubeDSP-Android-Starter.zip -d project
          test -f project/EquaTubeDSP/settings.gradle.kts
          test -f project/EquaTubeDSP/app/build.gradle.kts
          test -f project/EquaTubeDSP/app/src/main/cpp/CMakeLists.txt

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd project/EquaTubeDSP
          gradle --no-daemon --stacktrace --info --warning-mode all \
            :app:assembleDebug 2>&1 | tee build-log.txt

      - name: Locate APK
        if: always()
        shell: bash
        run: |
          find project/EquaTubeDSP/app/build/outputs -type f -name '*.apk' -print || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EquaTubeDSP-Build-Log
          path: project/EquaTubeDSP/build-log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EquaTubeDSP-APK
          path: project/EquaTubeDSP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
