
name: Build EquaTube DSP APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'EquaTubeDSP-Android-Starter.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          status=${PIPESTATUS[1]}
          exit "$status"

      - name: Install Android tools
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q EquaTubeDSP-Android-Starter.zip -d project

      - name: Check project files
        run: |
          ls -la project/EquaTubeDSP
          test -f project/EquaTubeDSP/settings.gradle.kts
          test -f project/EquaTubeDSP/app/build.gradle.kts

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p project/EquaTubeDSP \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EquaTubeDSP-APK
          path: project/EquaTubeDSP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
