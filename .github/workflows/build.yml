name: Build EquaTube DSP APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'EquaTubeDSP-Android-Starter.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download source code
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Gradle (Sudah mengaktifkan cache otomatis untuk Gradle)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # 5. Accept Android licenses
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          status=${PIPESTATUS[1]}
          exit "$status"

      # TAMBAHAN: Menyimpan cache NDK dan CMake untuk mempercepat build selanjutnya
      - name: Cache Android NDK & CMake
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/27.2.12479018
            /usr/
