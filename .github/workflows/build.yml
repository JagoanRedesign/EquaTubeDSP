
name: Build EquaTube DSP APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'EquaTubeDSP-Android-Starter.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build EquaTube DSP APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # 1. Checkout
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle 8.13
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 4. Android SDK
      # IMPORTANT: Do not install deprecated package "tools"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # 5. Install Android SDK components
      - name: Install Android tools
        shell: bash
        run: |
          set -e

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

          echo "Android SDK installation completed"

      # 6. Verify ZIP
      - name: Check source ZIP
        shell: bash
        run: |
          set -e

          test -f EquaTubeDSP-Android-Starter.zip

          unzip -t EquaTubeDSP-Android-Starter.zip

      # 7. Extract ZIP
      - name: Extract project
        shell: bash
        run: |
          set -e

          mkdir -p project

          unzip -q EquaTubeDSP-Android-Starter.zip -d project

          echo "ZIP extracted successfully"

      # 8. Check project structure
      - name: Check project files
        shell: bash
        run: |
          set -e

          cd project/EquaTubeDSP

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/cpp/CMakeLists.txt

          echo "Project structure OK"

      # 9. Check environment
      - name: Check Android environment
        run: |
          java -version
          gradle --version
          cmake --version
          adb version
          sdkmanager --list_installed

      # 10. Build APK
      - name: Build EquaTube DSP APK
        shell: bash
        run: |
          cd project/EquaTubeDSP

          set -o pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            :app:assembleDebug \
            2>&1 | tee build-log.txt

      # 11. Check APK
      - name: Check APK output
        if: always()
        shell: bash
        run: |
          echo "Searching APK..."

          find project/EquaTubeDSP/app/build/outputs \
            -type f -name "*.apk" || true

      # 12. Upload build log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EquaTubeDSP-Build-Log
          path: project/EquaTubeDSP/build-log.txt
          if-no-files-found: ignore
          retention-days: 7

      # 13. Upload APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EquaTubeDSP-APK
          path: project/EquaTubeDSP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
